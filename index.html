    <script>
      // apply the saved motion preference (or the OS setting) before anything paints
      try {
        var p = localStorage.getItem('motion-pref')
        if (p !== 'full' && p !== 'calm') p = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'calm' : 'full'
        document.documentElement.dataset.motion = p
      } catch (e) {
        document.documentElement.dataset.motion = 'full'
      }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
